# Publishes tagged releases through GitHub Actions with npm provenance.
#
# One-time npm setup:
#   Repository owner: izikipizi
#   Repository name:  n8n-nodes-nizlo
#   Workflow name:    publish.yml
#   Environment:      (blank)
#
# Configure that repository as an npm Trusted Publisher, then push a tag whose
# version matches package.json (for example v0.1.1). No long-lived npm token is
# required or stored in GitHub when trusted publishing is enabled.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Build and test
        run: npm test

      - name: Lint community node
        run: npm run lint

      - name: Publish with provenance
        run: npm publish --access public --provenance
